<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClawBot 人设编辑器</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #0f172a; background: #fff; font-family: system-ui, sans-serif; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .page { max-width: 1280px; margin: 0 auto; padding: 36px 28px 70px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .top h1 { margin: 0; font-size: 30px; }
    .layout { display: grid; grid-template-columns: 260px 1fr; gap: 46px; }
    .sidebar-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .character { display: flex; align-items: center; gap: 8px; width: 100%; margin: 6px 0; padding: 12px 14px; border: 0; border-radius: 14px; background: transparent; text-align: left; }
    .character.active { background: #eef2f7; font-weight: 700; }
    .character-name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .icon-button { border: 0; color: #64748b; background: transparent; }
    .primary { padding: 11px 18px; border: 0; border-radius: 14px; color: #fff; background: #0f172a; }
    .secondary { padding: 10px 15px; border: 1px solid #cbd5e1; border-radius: 12px; color: #334155; background: #fff; }
    .danger { color: #ef4444; }
    .tabs { display: flex; gap: 8px; margin-top: 20px; border-bottom: 1px solid #e2e8f0; }
    .tab { padding: 14px 28px; border: 0; border-bottom: 4px solid transparent; color: #64748b; background: transparent; font-size: 18px; }
    .tab.active { border-bottom-color: #0f172a; color: #0f172a; font-weight: 700; }
    .panel { display: none; padding-top: 34px; }
    .panel.active { display: block; }
    label { display: block; margin: 22px 0 9px; font-size: 17px; }
    input, textarea { width: 100%; border: 1px solid #cbd5e1; border-radius: 20px; padding: 15px 18px; outline: none; }
    textarea { resize: vertical; min-height: 120px; line-height: 1.6; }
    input:focus, textarea:focus { border-color: #64748b; }
    .save { width: 100%; margin-top: 28px; padding: 16px; border: 0; border-radius: 16px; color: #fff; background: #0f172a; font-size: 18px; }
    .memory-row { display: flex; gap: 12px; align-items: flex-start; margin: 10px 0; padding: 14px 16px; border: 1px solid #e2e8f0; border-radius: 15px; }
    .memory-text { flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; }
    .history-layout { display: grid; grid-template-columns: 190px minmax(0, 1fr); min-height: 480px; overflow: hidden; border: 1px solid #e2e8f0; border-radius: 18px; background: #fff; }
    .history-dates { max-height: 620px; overflow-y: auto; padding: 14px; border-right: 1px solid #e2e8f0; background: #f8fafc; }
    .history-date { display: block; width: 100%; margin-bottom: 8px; padding: 13px 14px; border: 1px solid transparent; border-radius: 13px; color: #475569; background: transparent; text-align: left; }
    .history-date:hover { background: #eef2f7; }
    .history-date.active { border-color: #0f172a; color: #fff; background: #0f172a; }
    .history-date-main { display: block; font-size: 17px; font-weight: 700; }
    .history-date-detail { display: block; margin-top: 4px; font-size: 12px; opacity: .75; }
    .history-messages { min-width: 0; max-height: 620px; overflow-y: auto; padding: 22px; background: #f8fafc; }
    .history-row { display: flex; margin: 14px 0; }
    .history-row.user { justify-content: flex-end; }
    .history-row.assistant { justify-content: flex-start; }
    .history-message { max-width: min(76%, 680px); }
    .history-meta { margin: 0 4px 6px; color: #64748b; font-size: 12px; }
    .history-row.user .history-meta { text-align: right; }
    .history-bubble { padding: 12px 16px; border: 1px solid #dbe3ee; border-radius: 6px 18px 18px 18px; background: #fff; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 1px 2px rgba(15, 23, 42, .04); }
    .history-row.user .history-bubble { border-color: #0f172a; border-radius: 18px 6px 18px 18px; color: #fff; background: #0f172a; }
    .connection { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; margin-bottom: 28px; padding: 16px; border-radius: 16px; background: #f8fafc; }
    .connection input { padding: 10px 13px; border-radius: 10px; }
    #status { margin: 8px 0 0; color: #64748b; }
    #status.ok { color: #15803d; }
    #status.error { color: #dc2626; }
    .empty { padding: 30px; color: #94a3b8; text-align: center; }
    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      .connection { grid-template-columns: 1fr; }
      .top { align-items: flex-start; flex-direction: column; }
      .history-layout { grid-template-columns: 1fr; min-height: 420px; }
      .history-dates { display: flex; gap: 8px; max-height: none; overflow-x: auto; padding: 12px; border-right: 0; border-bottom: 1px solid #e2e8f0; }
      .history-date { flex: 0 0 132px; margin: 0; }
      .history-messages { max-height: 560px; padding: 15px; }
      .history-message { max-width: 88%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="top">
      <h1>ClawBot 人设编辑器</h1>
      <button class="primary" id="exportPrompt">导出完整提示词</button>
    </div>

    <section class="connection">
      <input id="apiUrl" placeholder="Cloudflare 后端地址，例如 https://xxx.trycloudflare.com">
      <input id="apiToken" type="password" placeholder="管理令牌">
      <button class="primary" id="connect">连接后端</button>
      <p id="status">尚未连接云电脑后端。</p>
    </section>

    <div class="layout">
      <aside>
        <div class="sidebar-title">
          <strong>人物</strong>
          <button class="primary" id="addCharacter">+ 添加</button>
        </div>
        <div id="characterList"></div>
      </aside>

      <section>
        <h2 id="currentName">未连接</h2>
        <div class="tabs">
          <button class="tab active" data-tab="persona">人设</button>
          <button class="tab" data-tab="history">聊天记录</button>
          <button class="tab" data-tab="memory">记忆设置</button>
        </div>

        <div class="panel active" id="persona">
          <label for="description">核心人设描述</label>
          <textarea id="description" rows="8" placeholder="描述人物身份、性格、说话风格和行为规则"></textarea>
          <label for="traits">性格特点（每行一项）</label>
          <textarea id="traits" rows="4" placeholder="幽默&#10;诚实&#10;喜欢吐槽"></textarea>
          <label for="examples">示例对话（可选）</label>
          <textarea id="examples" rows="5" placeholder="用户：你今天心情怎么样？&#10;ClawBot：还行吧。"></textarea>
          <button class="save" id="savePersona">保存人设并同步到 ClawBot</button>
        </div>

        <div class="panel" id="history">
          <div id="historyList" class="empty">连接后显示 Bot 自动记录的对话。</div>
        </div>

        <div class="panel" id="memory">
          <div class="sidebar-title">
            <strong>记住的事</strong>
            <button class="secondary" id="addMemory">+ 添加</button>
          </div>
          <div id="memoryList"></div>
          <div class="sidebar-title" style="margin-top: 34px">
            <strong>必须遵守的规则</strong>
            <button class="secondary" id="addPromptMemory">+ 添加</button>
          </div>
          <div id="promptMemoryList"></div>
        </div>
      </section>
    </div>
  </main>

  <script>
    let state = { activeCharacterId: null, characters: [] };
    let history = [];
    let selectedHistoryDate = null;
    let selectedHistoryCharacterId = null;

    const elements = Object.fromEntries(
      [...document.querySelectorAll("[id]")].map(element => [element.id, element])
    );

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[character]);
    }

    function credentials() {
      const url = elements.apiUrl.value.trim().replace(/\/+$/, "");
      const token = elements.apiToken.value.trim();
      if (!url || !token) throw new Error("请输入后端地址和管理令牌。");
      localStorage.setItem("clawbot_api_url", url);
      sessionStorage.setItem("clawbot_api_token", token);
      return { url, token };
    }

    async function api(path, options = {}) {
      const { url, token } = credentials();
      const response = await fetch(url + path, {
        ...options,
        headers: {
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        throw new Error(body.error || `后端请求失败：${response.status}`);
      }
      return response.json();
    }

    function activeCharacter() {
      return state.characters.find(item => item.id === state.activeCharacterId);
    }

    function setStatus(message, type = "") {
      elements.status.textContent = message;
      elements.status.className = type;
    }

    async function loadBackend() {
      try {
        setStatus("正在连接...");
        const result = await api("/api/state");
        state = result.state;
        history = result.history || [];
        renderAll();
        setStatus("已连接云电脑，页面数据来自 ClawBot 后端。", "ok");
      } catch (error) {
        setStatus(error.message, "error");
      }
    }

    async function saveBackend(message = "已同步到 ClawBot。") {
      try {
        const result = await api("/api/state", {
          method: "PUT",
          body: JSON.stringify({ state })
        });
        state = result.state;
        renderAll();
        setStatus(message, "ok");
      } catch (error) {
        setStatus(error.message, "error");
        throw error;
      }
    }

    function renderAll() {
      renderCharacters();
      renderCurrent();
      renderMemories();
      renderHistory();
    }

    function renderCharacters() {
      elements.characterList.innerHTML = state.characters.map(character => `
        <button class="character ${character.id === state.activeCharacterId ? "active" : ""}"
                data-character="${escapeHtml(character.id)}">
          <span class="character-name">${escapeHtml(character.name)}</span>
          <span class="rename" title="重命名">✎</span>
          <span class="delete danger" title="删除">×</span>
        </button>
      `).join("");
      elements.characterList.querySelectorAll(".character").forEach(button => {
        button.addEventListener("click", async event => {
          const id = button.dataset.character;
          if (event.target.classList.contains("rename")) return renameCharacter(id);
          if (event.target.classList.contains("delete")) return deleteCharacter(id);
          state.activeCharacterId = id;
          await saveBackend("已切换 ClawBot 当前人设。");
        });
      });
    }

    function renderCurrent() {
      const character = activeCharacter();
      if (!character) return;
      elements.currentName.textContent = character.name;
      elements.description.value = character.persona.description || "";
      elements.traits.value = character.persona.traits || "";
      elements.examples.value = character.persona.examples || "";
    }

    function memoryRows(values, type) {
      if (!values.length) return '<div class="empty">暂无内容</div>';
      return values.map((value, index) => `
        <div class="memory-row">
          <div class="memory-text">${escapeHtml(value)}</div>
          <button class="icon-button edit-memory" data-type="${type}" data-index="${index}">编辑</button>
          <button class="icon-button danger delete-memory" data-type="${type}" data-index="${index}">删除</button>
        </div>
      `).join("");
    }

    function renderMemories() {
      const character = activeCharacter();
      if (!character) return;
      elements.memoryList.innerHTML = memoryRows(character.memories, "memories");
      elements.promptMemoryList.innerHTML = memoryRows(character.promptMemories, "promptMemories");
      document.querySelectorAll(".edit-memory").forEach(button => {
        button.addEventListener("click", () => editMemory(button.dataset.type, Number(button.dataset.index)));
      });
      document.querySelectorAll(".delete-memory").forEach(button => {
        button.addEventListener("click", () => deleteMemory(button.dataset.type, Number(button.dataset.index)));
      });
    }

    function renderHistory() {
      const character = activeCharacter();
      if (!character) return;
      const rows = history
        .filter(item => item.character_id === character.id)
        .map(item => ({ ...item, date: historyDateParts(item.created_at) }));

      if (!rows.length) {
        selectedHistoryDate = null;
        selectedHistoryCharacterId = character.id;
        elements.historyList.className = "empty";
        elements.historyList.innerHTML = "该人设还没有自动记录的对话。";
        return;
      }

      const grouped = rows.reduce((result, item) => {
        const key = item.date.key;
        if (!result.has(key)) result.set(key, []);
        result.get(key).push(item);
        return result;
      }, new Map());
      const dates = [...grouped.keys()].sort((left, right) => right.localeCompare(left));

      if (selectedHistoryCharacterId !== character.id || !grouped.has(selectedHistoryDate)) {
        selectedHistoryDate = dates[0];
      }
      selectedHistoryCharacterId = character.id;

      elements.historyList.className = "history-layout";
      elements.historyList.innerHTML = `
        <div class="history-dates" aria-label="聊天记录日期">
          ${dates.map(key => {
            const items = grouped.get(key);
            const date = items[0].date;
            return `
              <button class="history-date ${key === selectedHistoryDate ? "active" : ""}"
                      data-history-date="${escapeHtml(key)}">
                <span class="history-date-main">${escapeHtml(date.label)}</span>
                <span class="history-date-detail">${escapeHtml(date.weekday)} · ${items.length} 条消息</span>
              </button>
            `;
          }).join("")}
        </div>
        <div class="history-messages">
          ${historyMessages(grouped.get(selectedHistoryDate))}
        </div>
      `;
      elements.historyList.querySelectorAll(".history-date").forEach(button => {
        button.addEventListener("click", () => {
          selectedHistoryDate = button.dataset.historyDate;
          renderHistory();
        });
      });
    }

    function historyDateParts(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return { key: "0000-00-00", label: "日期未知", weekday: "时间格式异常", time: "--:--" };
      }
      const parts = Object.fromEntries(
        new Intl.DateTimeFormat("zh-CN", {
          timeZone: "Asia/Shanghai",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          weekday: "short",
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23"
        }).formatToParts(date).map(part => [part.type, part.value])
      );
      return {
        key: `${parts.year}-${parts.month}-${parts.day}`,
        label: `${parts.month}月${parts.day}日`,
        weekday: parts.weekday,
        time: `${parts.hour}:${parts.minute}`
      };
    }

    function historyMessages(rows) {
      return [...rows]
        .sort((left, right) => {
          const leftTime = Date.parse(left.created_at);
          const rightTime = Date.parse(right.created_at);
          if (Number.isNaN(leftTime) || Number.isNaN(rightTime)) {
            return Number(left.id || 0) - Number(right.id || 0);
          }
          return leftTime - rightTime;
        })
        .map(item => {
          const isUser = item.role === "user";
          return `
            <div class="history-row ${isUser ? "user" : "assistant"}">
              <div class="history-message">
                <div class="history-meta">${isUser ? "用户" : "ClawBot"} · ${escapeHtml(item.date.time)}</div>
                <div class="history-bubble">${escapeHtml(item.content)}</div>
              </div>
            </div>
          `;
        }).join("");
    }

    async function addCharacter() {
      const name = prompt("请输入新人物名称：", "新 ClawBot");
      if (!name?.trim()) return;
      const id = `char_${Date.now()}`;
      state.characters.push({
        id,
        name: name.trim(),
        persona: { description: "", traits: "", examples: "" },
        memories: [],
        promptMemories: []
      });
      state.activeCharacterId = id;
      await saveBackend("人物已创建并同步。");
    }

    async function renameCharacter(id) {
      const character = state.characters.find(item => item.id === id);
      const name = prompt("请输入新名称：", character.name);
      if (!name?.trim()) return;
      character.name = name.trim();
      await saveBackend("人物名称已同步。");
    }

    async function deleteCharacter(id) {
      if (state.characters.length <= 1) return alert("至少保留一个人物。");
      if (!confirm("删除该人物及其人设和记忆？聊天历史仍保存在数据库中。")) return;
      state.characters = state.characters.filter(item => item.id !== id);
      if (state.activeCharacterId === id) state.activeCharacterId = state.characters[0].id;
      await saveBackend("人物已删除。");
    }

    async function savePersona() {
      const character = activeCharacter();
      character.persona = {
        description: elements.description.value.trim(),
        traits: elements.traits.value.trim(),
        examples: elements.examples.value.trim()
      };
      await saveBackend("人设已保存，ClawBot 下一条回复立即生效。");
    }

    async function addMemory(type, label) {
      const value = prompt(label);
      if (!value?.trim()) return;
      activeCharacter()[type].push(value.trim());
      await saveBackend("记忆已同步到 ClawBot。");
    }

    async function editMemory(type, index) {
      const list = activeCharacter()[type];
      const value = prompt("编辑内容：", list[index]);
      if (value === null || !value.trim()) return;
      list[index] = value.trim();
      await saveBackend("记忆已更新。");
    }

    async function deleteMemory(type, index) {
      if (!confirm("删除这条内容？")) return;
      activeCharacter()[type].splice(index, 1);
      await saveBackend("记忆已删除。");
    }

    function exportPrompt() {
      const character = activeCharacter();
      if (!character) return;
      const persona = character.persona;
      const sections = [`你是 ${character.name}。`];
      if (persona.description) sections.push(`【核心人设】\n${persona.description}`);
      if (persona.traits) sections.push(`【性格特点】\n${persona.traits}`);
      if (persona.examples) sections.push(`【示例对话】\n${persona.examples}`);
      if (character.promptMemories.length) sections.push(`【必须遵守的规则】\n${character.promptMemories.map(item => `- ${item}`).join("\n")}`);
      if (character.memories.length) sections.push(`【需要记住的信息】\n${character.memories.map(item => `- ${item}`).join("\n")}`);
      navigator.clipboard.writeText(sections.join("\n\n"))
        .then(() => setStatus("完整提示词已复制。", "ok"))
        .catch(() => setStatus("复制失败，请检查浏览器剪贴板权限。", "error"));
    }

    document.querySelectorAll(".tab").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".tab, .panel").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        document.getElementById(button.dataset.tab).classList.add("active");
      });
    });
    elements.connect.addEventListener("click", loadBackend);
    elements.addCharacter.addEventListener("click", addCharacter);
    elements.savePersona.addEventListener("click", savePersona);
    elements.addMemory.addEventListener("click", () => addMemory("memories", "输入要记住的事："));
    elements.addPromptMemory.addEventListener("click", () => addMemory("promptMemories", "输入必须遵守的规则："));
    elements.exportPrompt.addEventListener("click", exportPrompt);

    elements.apiUrl.value = localStorage.getItem("clawbot_api_url") || "";
    elements.apiToken.value = sessionStorage.getItem("clawbot_api_token") || "";
    if (elements.apiUrl.value && elements.apiToken.value) loadBackend();
  </script>
</body>
</html>
