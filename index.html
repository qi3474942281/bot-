<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClawBot 人设编辑器</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #0f172a; background: #fff; font-family: system-ui, sans-serif; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .page { max-width: 1280px; margin: 0 auto; padding: 36px 28px 70px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .top h1 { margin: 0; font-size: 30px; }
    .layout { display: grid; grid-template-columns: 260px 1fr; gap: 46px; }
    .sidebar-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .character { display: flex; align-items: center; gap: 8px; width: 100%; margin: 6px 0; padding: 12px 14px; border: 0; border-radius: 14px; background: transparent; text-align: left; }
    .character.active { background: #eef2f7; font-weight: 700; }
    .character-name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .icon-button { border: 0; color: #64748b; background: transparent; }
    .primary { padding: 11px 18px; border: 0; border-radius: 14px; color: #fff; background: #0f172a; }
    .secondary { padding: 10px 15px; border: 1px solid #cbd5e1; border-radius: 12px; color: #334155; background: #fff; }
    .danger { color: #ef4444; }
    .tabs { display: flex; gap: 8px; margin-top: 20px; border-bottom: 1px solid #e2e8f0; }
    .tab { padding: 14px 28px; border: 0; border-bottom: 4px solid transparent; color: #64748b; background: transparent; font-size: 18px; }
    .tab.active { border-bottom-color: #0f172a; color: #0f172a; font-weight: 700; }
    .panel { display: none; padding-top: 34px; }
    .panel.active { display: block; }
    label { display: block; margin: 22px 0 9px; font-size: 17px; }
    input, textarea { width: 100%; border: 1px solid #cbd5e1; border-radius: 20px; padding: 15px 18px; outline: none; }
    textarea { resize: vertical; min-height: 120px; line-height: 1.6; }
    input:focus, textarea:focus { border-color: #64748b; }
    .save { width: 100%; margin-top: 28px; padding: 16px; border: 0; border-radius: 16px; color: #fff; background: #0f172a; font-size: 18px; }
    .memory-row { display: flex; gap: 12px; align-items: flex-start; margin: 10px 0; padding: 14px 16px; border: 1px solid #e2e8f0; border-radius: 15px; }
    .memory-text { flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; }
    .history-layout { display: grid; grid-template-columns: 190px minmax(0, 1fr); min-height: 480px; overflow: hidden; border: 1px solid #e2e8f0; border-radius: 18px; background: #fff; }
    .history-dates { max-height: 620px; overflow-y: auto; padding: 14px; border-right: 1px solid #e2e8f0; background: #f8fafc; }
    .history-date { display: block; width: 100%; margin-bottom: 8px; padding: 13px 14px; border: 1px solid transparent; border-radius: 13px; color: #475569; background: transparent; text-align: left; }
    .history-date:hover { background: #eef2f7; }
    .history-date.active { border-color: #0f172a; color: #fff; background: #0f172a; }
    .history-date-main { display: block; font-size: 17px; font-weight: 700; }
    .history-date-detail { display: block; margin-top: 4px; font-size: 12px; opacity: .75; }
    .history-messages { min-width: 0; max-height: 620px; overflow-y: auto; padding: 22px; background: #f8fafc; }
    .history-row { display: flex; margin: 14px 0; }
    .history-row.user { justify-content: flex-end; }
    .history-row.assistant { justify-content: flex-start; }
    .history-message { max-width: min(76%, 680px); }
    .history-meta { margin: 0 4px 6px; color: #64748b; font-size: 12px; }
    .history-row.user .history-meta { text-align: right; }
    .history-bubble { padding: 12px 16px; border: 1px solid #dbe3ee; border-radius: 6px 18px 18px 18px; background: #fff; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 1px 2px rgba(15, 23, 42, .04); }
    .history-row.user .history-bubble { border-color: #0f172a; border-radius: 18px 6px 18px 18px; color: #fff; background: #0f172a; }
    .memory-layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: 520px; overflow: hidden; border: 1px solid #e2e8f0; border-radius: 18px; }
    .memory-nav { padding: 14px; border-right: 1px solid #e2e8f0; background: #f8fafc; }
    .memory-nav-button { display: block; width: 100%; margin-bottom: 8px; padding: 14px; border: 0; border-radius: 13px; color: #475569; background: transparent; text-align: left; }
    .memory-nav-button.active { color: #fff; background: #0f172a; font-weight: 700; }
    .memory-content { min-width: 0; padding: 24px; }
    .memory-section-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .memory-section-header h3 { margin: 0; }
    .memory-source { flex: 0 0 auto; padding: 3px 8px; border-radius: 999px; color: #475569; background: #e2e8f0; font-size: 12px; }
    .memory-source.ai { color: #1d4ed8; background: #dbeafe; }
    .settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .setting-card { padding: 16px; border: 1px solid #e2e8f0; border-radius: 14px; background: #f8fafc; }
    .setting-card label { margin: 0 0 8px; font-size: 14px; }
    .setting-card input, .setting-card select { width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 10px; background: #fff; }
    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .switch-row input { width: 22px; height: 22px; }
    .overview-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 22px; }
    .stat-card { padding: 14px; border-radius: 13px; background: #f1f5f9; }
    .stat-card strong { display: block; margin-top: 4px; font-size: 18px; }
    .memory-table-wrap { overflow-x: auto; margin: 12px 0 28px; }
    .memory-table { width: 100%; min-width: 680px; border-collapse: collapse; }
    .memory-table th, .memory-table td { padding: 12px; border: 1px solid #e2e8f0; text-align: left; vertical-align: top; }
    .memory-table th { background: #f8fafc; }
    .memory-table-actions { white-space: nowrap; }
    .memory-error { margin-bottom: 18px; padding: 12px 14px; border-radius: 12px; color: #b91c1c; background: #fef2f2; }
    .general-note { margin: 0 0 18px; padding: 14px 16px; border-radius: 13px; color: #475569; background: #f1f5f9; line-height: 1.6; }
    .general-status { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
    .general-status .stat-card { min-height: 76px; }
    .affection-value { display: flex; align-items: baseline; gap: 8px; margin-bottom: 16px; }
    .affection-value strong { font-size: 42px; color: #0f172a; }
    .affection-progress { height: 14px; margin-bottom: 20px; overflow: hidden; border-radius: 999px; background: #e2e8f0; }
    .affection-progress span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #f472b6, #ec4899); }
    .affection-controls { display: grid; grid-template-columns: 1fr 140px; gap: 14px; align-items: center; }
    .affection-history { display: grid; gap: 10px; margin-top: 24px; }
    .affection-history-row { padding: 13px 15px; border: 1px solid #e2e8f0; border-radius: 13px; background: #fff; }
    .affection-history-row strong.positive { color: #16a34a; }
    .affection-history-row strong.negative { color: #dc2626; }
    .connection { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; margin-bottom: 28px; padding: 16px; border-radius: 16px; background: #f8fafc; }
    .connection input { padding: 10px 13px; border-radius: 10px; }
    #status { margin: 8px 0 0; color: #64748b; }
    #status.ok { color: #15803d; }
    #status.error { color: #dc2626; }
    .empty { padding: 30px; color: #94a3b8; text-align: center; }
    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      .connection { grid-template-columns: 1fr; }
      .top { align-items: flex-start; flex-direction: column; }
      .history-layout { grid-template-columns: 1fr; min-height: 420px; }
      .history-dates { display: flex; gap: 8px; max-height: none; overflow-x: auto; padding: 12px; border-right: 0; border-bottom: 1px solid #e2e8f0; }
      .history-date { flex: 0 0 132px; margin: 0; }
      .history-messages { max-height: 560px; padding: 15px; }
      .history-message { max-width: 88%; }
      .memory-layout { grid-template-columns: 1fr; }
      .memory-nav { display: flex; gap: 8px; overflow-x: auto; border-right: 0; border-bottom: 1px solid #e2e8f0; }
      .memory-nav-button { flex: 0 0 142px; margin: 0; }
      .memory-content { padding: 16px; }
      .settings-grid, .overview-stats, .general-status, .affection-controls { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="top">
      <h1>ClawBot 人设编辑器</h1>
      <button class="primary" id="exportPrompt">导出完整提示词</button>
    </div>

    <section class="connection">
      <input id="apiUrl" placeholder="Cloudflare 后端地址，例如 https://xxx.trycloudflare.com">
      <input id="apiToken" type="password" placeholder="管理令牌">
      <button class="primary" id="connect">连接后端</button>
      <p id="status">尚未连接云电脑后端。</p>
    </section>

    <div class="layout">
      <aside>
        <div class="sidebar-title">
          <strong>人物</strong>
          <button class="primary" id="addCharacter">+ 添加</button>
        </div>
        <div id="characterList"></div>
      </aside>

      <section>
        <h2 id="currentName">未连接</h2>
        <div class="tabs">
          <button class="tab active" data-tab="persona">人设</button>
          <button class="tab" data-tab="history">聊天记录</button>
          <button class="tab" data-tab="memory">记忆设置</button>
          <button class="tab" data-tab="general">通用设置</button>
        </div>

        <div class="panel active" id="persona">
          <label for="description">核心人设描述</label>
          <textarea id="description" rows="8" placeholder="描述人物身份、性格、说话风格和行为规则"></textarea>
          <label for="traits">性格特点（每行一项）</label>
          <textarea id="traits" rows="4" placeholder="幽默&#10;诚实&#10;喜欢吐槽"></textarea>
          <label for="examples">示例对话（可选）</label>
          <textarea id="examples" rows="5" placeholder="用户：你今天心情怎么样？&#10;ClawBot：还行吧。"></textarea>
          <button class="save" id="savePersona">保存人设并同步到 ClawBot</button>
        </div>

        <div class="panel" id="history">
          <div id="historyList" class="empty">连接后显示 Bot 自动记录的对话。</div>
        </div>

        <div class="panel" id="memory">
          <div class="memory-layout">
            <nav class="memory-nav" id="memoryNav">
              <button class="memory-nav-button active" data-memory-section="affection">好感度</button>
              <button class="memory-nav-button" data-memory-section="facts">记住的事</button>
              <button class="memory-nav-button" data-memory-section="rules">必须遵守的规则</button>
              <button class="memory-nav-button" data-memory-section="settings">记忆设置</button>
              <button class="memory-nav-button" data-memory-section="overview">记忆总览</button>
            </nav>
            <div class="memory-content" id="memoryContent">
              <div class="empty">连接后显示记忆内容。</div>
            </div>
          </div>
        </div>

        <div class="panel" id="general">
          <div id="generalContent" class="empty">连接后显示当前人物的通用设置。</div>
        </div>
      </section>
    </div>
  </main>

  <script>
    let state = { activeCharacterId: null, characters: [] };
    let history = [];
    let selectedHistoryDate = null;
    let selectedHistoryCharacterId = null;
    let memoryData = null;
    let proactiveData = null;
    let generalData = null;
    let affectionData = null;
    let selectedMemorySection = "affection";

    const elements = Object.fromEntries(
      [...document.querySelectorAll("[id]")].map(element => [element.id, element])
    );

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[character]);
    }

    function credentials() {
      const url = elements.apiUrl.value.trim().replace(/\/+$/, "");
      const token = elements.apiToken.value.trim();
      if (!url || !token) throw new Error("请输入后端地址和管理令牌。");
      localStorage.setItem("clawbot_api_url", url);
      sessionStorage.setItem("clawbot_api_token", token);
      return { url, token };
    }

    async function api(path, options = {}) {
      const { url, token } = credentials();
      const response = await fetch(url + path, {
        ...options,
        headers: {
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        throw new Error(body.error || `后端请求失败：${response.status}`);
      }
      return response.json();
    }

    function activeCharacter() {
      return state.characters.find(item => item.id === state.activeCharacterId);
    }

    function setStatus(message, type = "") {
      elements.status.textContent = message;
      elements.status.className = type;
    }

    async function loadBackend() {
      try {
        setStatus("正在连接...");
        const result = await api("/api/state");
        state = result.state;
        history = result.history || [];
        await loadMemory();
        await loadProactive();
        await loadGeneral();
        await loadAffection();
        renderAll();
        setStatus("已连接云电脑，页面数据来自 ClawBot 后端。", "ok");
      } catch (error) {
        setStatus(error.message, "error");
      }
    }

    async function saveBackend(message = "已同步到 ClawBot。") {
      try {
        const result = await api("/api/state", {
          method: "PUT",
          body: JSON.stringify({ state })
        });
        state = result.state;
        await loadMemory();
        await loadProactive();
        await loadGeneral();
        await loadAffection();
        renderAll();
        setStatus(message, "ok");
      } catch (error) {
        setStatus(error.message, "error");
        throw error;
      }
    }

    function renderAll() {
      renderCharacters();
      renderCurrent();
      renderMemories();
      renderHistory();
      renderGeneralSettings();
    }

    function renderCharacters() {
      elements.characterList.innerHTML = state.characters.map(character => `
        <button class="character ${character.id === state.activeCharacterId ? "active" : ""}"
                data-character="${escapeHtml(character.id)}">
          <span class="character-name">${escapeHtml(character.name)}</span>
          <span class="rename" title="重命名">✎</span>
          <span class="delete danger" title="删除">×</span>
        </button>
      `).join("");
      elements.characterList.querySelectorAll(".character").forEach(button => {
        button.addEventListener("click", async event => {
          const id = button.dataset.character;
          if (event.target.classList.contains("rename")) return renameCharacter(id);
          if (event.target.classList.contains("delete")) return deleteCharacter(id);
          state.activeCharacterId = id;
          await saveBackend("已切换 ClawBot 当前人设。");
        });
      });
    }

    function renderCurrent() {
      const character = activeCharacter();
      if (!character) return;
      elements.currentName.textContent = character.name;
      elements.description.value = character.persona.description || "";
      elements.traits.value = character.persona.traits || "";
      elements.examples.value = character.persona.examples || "";
    }

    async function loadMemory() {
      const character = activeCharacter();
      if (!character) return;
      memoryData = await api(`/api/memory/${encodeURIComponent(character.id)}`);
    }

    async function loadProactive() {
      const character = activeCharacter();
      if (!character) return;
      proactiveData = await api(`/api/proactive/${encodeURIComponent(character.id)}`);
    }

    async function loadGeneral() {
      const character = activeCharacter();
      if (!character) return;
      generalData = await api(`/api/general/${encodeURIComponent(character.id)}`);
    }

    async function loadAffection() {
      const character = activeCharacter();
      if (!character) return;
      affectionData = await api(`/api/affection/${encodeURIComponent(character.id)}`);
    }

    function proactiveModeLabel(config) {
      const labels = {
        exact: `精确每 ${config.exactMinutes} 分钟`,
        random_1_30: "1–30 分钟随机",
        random_30_60: "30–60 分钟随机",
        random_60_120: "1–2 小时随机",
        random_120_180: "2–3 小时随机",
        random_180_240: "3–4 小时随机",
        random_240_300: "4–5 小时随机",
        random_1_300: "1 分钟–5 小时完全随机"
      };
      return labels[config.mode] || labels.random_60_120;
    }

    function formatChinaTime(value) {
      if (!value) return "等待首次微信聊天";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "尚未安排";
      return new Intl.DateTimeFormat("zh-CN", {
        timeZone: "Asia/Shanghai",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      }).format(date);
    }

    function renderGeneralSettings() {
      const character = activeCharacter();
      if (!character || !proactiveData || !generalData ||
          proactiveData.characterId !== character.id ||
          generalData.characterId !== character.id) return;
      const config = proactiveData.config;
      const progress = proactiveData.progress;
      const general = generalData.config;
      const modelOptions = Object.entries(generalData.models || {}).map(([key, value]) => `
        <option value="${escapeHtml(key)}" ${general.currentModel === key ? "selected" : ""}>
          ${escapeHtml(key)} · ${escapeHtml(value.model || "")}
        </option>
      `).join("");
      elements.generalContent.className = "";
      elements.generalContent.innerHTML = `
        <div class="memory-section-header"><h3>通用设置</h3></div>
        <p class="general-note">设置仅作用于“${escapeHtml(character.name)}”。只有当前选中的人物会发送主动消息；首次收到微信消息后才开始计时。</p>
        ${progress.lastError ? `<div class="memory-error">最近错误：${escapeHtml(progress.lastError)}</div>` : ""}
        <div class="general-status">
          <div class="stat-card">当前状态<strong>${config.enabled ? "已开启" : "已关闭"}</strong></div>
          <div class="stat-card">当前频率<strong>${escapeHtml(proactiveModeLabel(config))}</strong></div>
          <div class="stat-card">允许时段<strong>${escapeHtml(config.windowStart)}–${escapeHtml(config.windowEnd)}</strong><small>北京时间</small></div>
          <div class="stat-card">下次计划<strong>${config.enabled ? escapeHtml(formatChinaTime(progress.nextSendAt)) : "未启用"}</strong></div>
        </div>
        <div class="settings-grid">
          <div class="setting-card">
            <label for="chatModel">当前人物聊天模型</label>
            <select id="chatModel">${modelOptions}</select>
          </div>
          <div class="setting-card">
            <label for="mergeWaitSeconds">连续消息合并等待（秒）</label>
            <input id="mergeWaitSeconds" type="number" min="1" max="30" value="${general.mergeWaitSeconds}">
          </div>
          <div class="setting-card switch-row"><label for="proactiveEnabled">主动消息</label><input id="proactiveEnabled" type="checkbox" ${config.enabled ? "checked" : ""}></div>
          <div class="setting-card">
            <label for="proactiveMode">主动消息频率</label>
            <select id="proactiveMode">
              <option value="exact" ${config.mode === "exact" ? "selected" : ""}>按分钟精确频率</option>
              <option value="random_1_30" ${config.mode === "random_1_30" ? "selected" : ""}>0–0.5 小时随机（1–30 分钟）</option>
              <option value="random_30_60" ${config.mode === "random_30_60" ? "selected" : ""}>0.5–1 小时随机</option>
              <option value="random_60_120" ${config.mode === "random_60_120" ? "selected" : ""}>1–2 小时随机</option>
              <option value="random_120_180" ${config.mode === "random_120_180" ? "selected" : ""}>2–3 小时随机</option>
              <option value="random_180_240" ${config.mode === "random_180_240" ? "selected" : ""}>3–4 小时随机</option>
              <option value="random_240_300" ${config.mode === "random_240_300" ? "selected" : ""}>4–5 小时随机</option>
              <option value="random_1_300" ${config.mode === "random_1_300" ? "selected" : ""}>完全随机（1 分钟–5 小时）</option>
            </select>
          </div>
          <div class="setting-card"><label for="exactMinutes">精确间隔（分钟）</label><input id="exactMinutes" type="number" min="1" max="1440" value="${config.exactMinutes}"></div>
          <div class="setting-card"><label for="windowStart">允许发送开始时间</label><input id="windowStart" type="time" value="${escapeHtml(config.windowStart)}"></div>
          <div class="setting-card"><label for="windowEnd">允许发送结束时间</label><input id="windowEnd" type="time" value="${escapeHtml(config.windowEnd)}"></div>
        </div>
        <button class="save" id="saveGeneralSettings">保存通用设置</button>
      `;
      const mode = document.getElementById("proactiveMode");
      const exact = document.getElementById("exactMinutes");
      const updateExactState = () => exact.disabled = mode.value !== "exact";
      mode.addEventListener("change", updateExactState);
      updateExactState();
      document.getElementById("saveGeneralSettings").addEventListener(
        "click", () => saveGeneralSettings().catch(handleGeneralError)
      );
    }

    async function saveGeneralSettings() {
      const generalConfig = {
        ...generalData.config,
        currentModel: document.getElementById("chatModel").value,
        mergeWaitSeconds: Number(document.getElementById("mergeWaitSeconds").value)
      };
      const config = {
        ...proactiveData.config,
        enabled: document.getElementById("proactiveEnabled").checked,
        mode: document.getElementById("proactiveMode").value,
        exactMinutes: Number(document.getElementById("exactMinutes").value),
        windowStart: document.getElementById("windowStart").value,
        windowEnd: document.getElementById("windowEnd").value
      };
      proactiveData = await api(`/api/proactive/${encodeURIComponent(activeCharacter().id)}`, {
        method: "PUT",
        body: JSON.stringify({ config, version: proactiveData.version })
      });
      generalData = await api(`/api/general/${encodeURIComponent(activeCharacter().id)}`, {
        method: "PUT",
        body: JSON.stringify({ config: generalConfig, version: generalData.version })
      });
      renderGeneralSettings();
      setStatus("通用设置已保存。", "ok");
    }

    async function handleGeneralError(error) {
      setStatus(error.message || "通用设置保存失败。", "error");
      if (String(error.message || "").includes("已更新")) {
        await loadProactive();
        await loadGeneral();
        renderGeneralSettings();
      }
    }

    function memoryRows(values, type) {
      if (!values.length) return '<div class="empty">暂无内容</div>';
      return values.map((value, index) => `
        <div class="memory-row">
          <div class="memory-text">${escapeHtml(type === "rules" ? value : value.content)}</div>
          ${type === "facts" ? `<span class="memory-source ${value.source === "ai" ? "ai" : ""}">${value.source === "ai" ? "AI" : "用户"}</span>` : ""}
          <button class="icon-button edit-memory" data-type="${type}" data-index="${index}">编辑</button>
          <button class="icon-button danger delete-memory" data-type="${type}" data-index="${index}">删除</button>
        </div>
      `).join("");
    }

    function renderMemories() {
      const character = activeCharacter();
      if (!character || !memoryData || memoryData.characterId !== character.id) return;
      elements.memoryNav.querySelectorAll(".memory-nav-button").forEach(button => {
        button.classList.toggle("active", button.dataset.memorySection === selectedMemorySection);
      });
      if (selectedMemorySection === "affection") {
        renderAffection();
      } else if (selectedMemorySection === "facts") {
        elements.memoryContent.innerHTML = `
          <div class="memory-section-header"><h3>记住的事</h3><button class="secondary" id="addFact">+ 添加</button></div>
          ${memoryRows(memoryData.facts, "facts")}
        `;
      } else if (selectedMemorySection === "rules") {
        elements.memoryContent.innerHTML = `
          <div class="memory-section-header"><h3>必须遵守的规则</h3><button class="secondary" id="addRule">+ 添加</button></div>
          <p style="color:#64748b">这里只接受用户手动维护，AI 不会自动添加或修改。</p>
          ${memoryRows(character.promptMemories, "rules")}
        `;
      } else if (selectedMemorySection === "settings") {
        renderMemorySettings();
      } else {
        renderMemoryOverview();
      }
      document.querySelectorAll(".edit-memory").forEach(button => {
        button.addEventListener("click", () => editMemory(button.dataset.type, Number(button.dataset.index)).catch(handleMemoryError));
      });
      document.querySelectorAll(".delete-memory").forEach(button => {
        button.addEventListener("click", () => deleteMemory(button.dataset.type, Number(button.dataset.index)).catch(handleMemoryError));
      });
      document.getElementById("addFact")?.addEventListener("click", () => addMemory("facts", "输入要记住的关键信息：").catch(handleMemoryError));
      document.getElementById("addRule")?.addEventListener("click", () => addMemory("rules", "输入必须遵守的规则：").catch(handleMemoryError));
      document.getElementById("saveMemorySettings")?.addEventListener("click", () => saveMemorySettings().catch(handleMemoryError));
      document.getElementById("saveAffection")?.addEventListener("click", () => saveAffection().catch(handleMemoryError));
      const affectionRange = document.getElementById("affectionRange");
      const affectionNumber = document.getElementById("affectionNumber");
      affectionRange?.addEventListener("input", () => affectionNumber.value = affectionRange.value);
      affectionNumber?.addEventListener("input", () => affectionRange.value = Math.max(0, Math.min(500, Number(affectionNumber.value) || 0)));
      document.querySelectorAll(".edit-overview").forEach(button => {
        button.addEventListener("click", () => editOverviewEntry(button.dataset.kind, Number(button.dataset.id)).catch(handleMemoryError));
      });
      document.querySelectorAll(".delete-overview").forEach(button => {
        button.addEventListener("click", () => deleteOverviewEntry(Number(button.dataset.id)).catch(handleMemoryError));
      });
      document.querySelectorAll(".add-overview").forEach(button => {
        button.addEventListener("click", () => addOverviewEntry(button.dataset.kind).catch(handleMemoryError));
      });
    }

    async function handleMemoryError(error) {
      setStatus(error.message || "记忆操作失败。", "error");
      if (String(error.message || "").includes("已更新")) {
        await loadMemory();
        renderMemories();
      }
    }

    function renderAffection() {
      if (!affectionData) {
        elements.memoryContent.innerHTML = '<div class="empty">正在读取好感度...</div>';
        return;
      }
      const value = Number(affectionData.value || 0);
      const history = affectionData.history || [];
      elements.memoryContent.innerHTML = `
        <div class="memory-section-header"><h3>好感度</h3></div>
        <div class="affection-value"><strong>${value}</strong><span>/ 500</span></div>
        <div class="affection-progress"><span style="width:${value / 5}%"></span></div>
        <div class="affection-controls">
          <input id="affectionRange" type="range" min="0" max="500" value="${value}">
          <input id="affectionNumber" type="number" min="0" max="500" value="${value}">
        </div>
        <button class="save" id="saveAffection">保存初始/当前好感度</button>
        <div class="memory-section-header" style="margin-top:28px"><h3>最近自动变化</h3></div>
        <div class="affection-history">
          ${history.length ? history.map(item => {
            const delta = Number(item.delta || 0);
            const sign = delta > 0 ? "+" : "";
            const className = delta >= 0 ? "positive" : "negative";
            return `
              <div class="affection-history-row">
                <strong class="${className}">${sign}${delta}</strong>
                <span> · 变化后 ${item.value_after}</span>
                <small> · ${escapeHtml(formatChinaTime(item.created_at))}</small>
                <div>${escapeHtml(item.reason || "未记录原因")}</div>
              </div>
            `;
          }).join("") : '<div class="empty">暂无自动变化记录</div>'}
        </div>
      `;
    }

    async function saveAffection() {
      const value = Math.max(0, Math.min(
        500, Number(document.getElementById("affectionNumber").value) || 0
      ));
      affectionData = await api(`/api/affection/${encodeURIComponent(activeCharacter().id)}`, {
        method: "PUT",
        body: JSON.stringify({ value, version: affectionData.version })
      });
      renderMemories();
      setStatus("好感度已保存。", "ok");
    }

    function renderMemorySettings() {
      const config = memoryData.config;
      const modelOptions = Object.entries(memoryData.models || {}).map(([key, value]) => `
        <option value="${escapeHtml(key)}" ${config.summaryModel === key ? "selected" : ""}>${escapeHtml(key)} · ${escapeHtml(value.model || "")}</option>
      `).join("");
      elements.memoryContent.innerHTML = `
        <div class="memory-section-header"><h3>记忆设置</h3></div>
        <div class="settings-grid">
          <div class="setting-card"><label>总结模型</label><select id="summaryModel"><option value="">跟随当前聊天模型</option>${modelOptions}</select></div>
          ${numberSetting("factRounds", "每多少轮生成一条关键事实", config.factRounds)}
          ${numberSetting("stmRounds", "每多少轮生成一条 STM", config.stmRounds)}
          ${numberSetting("ltmAfterStm", "每多少条 STM 生成一条 LTM", config.ltmAfterStm)}
          ${numberSetting("stmMinChars", "STM 最少字数", config.stmMinChars)}
          ${numberSetting("stmMaxChars", "STM 最多字数", config.stmMaxChars)}
          ${numberSetting("ltmMinChars", "LTM 最少字数", config.ltmMinChars)}
          ${numberSetting("ltmMaxChars", "LTM 最多字数", config.ltmMaxChars)}
          <div class="setting-card switch-row"><label for="factsAuto">关键事实自动生成</label><input id="factsAuto" type="checkbox" ${config.factsAuto ? "checked" : ""}></div>
          <div class="setting-card switch-row"><label for="engineAuto">STM/LTM 自动生成</label><input id="engineAuto" type="checkbox" ${config.engineAuto ? "checked" : ""}></div>
        </div>
        <button class="save" id="saveMemorySettings">保存记忆设置</button>
      `;
    }

    function numberSetting(id, label, value) {
      return `<div class="setting-card"><label for="${id}">${label}</label><input id="${id}" type="number" min="1" value="${value}"></div>`;
    }

    function renderMemoryOverview() {
      const config = memoryData.config;
      const progress = memoryData.progress;
      const model = config.summaryModel || "跟随当前模型";
      elements.memoryContent.innerHTML = `
        <div class="memory-section-header"><h3>记忆总览</h3></div>
        ${progress.lastError ? `<div class="memory-error">最近错误：${escapeHtml(progress.lastError)}</div>` : ""}
        <div class="overview-stats">
          <div class="stat-card">总结模型<strong>${escapeHtml(model)}</strong></div>
          <div class="stat-card">关键事实进度<strong>${progress.factRounds} / ${config.factRounds}</strong><small>剩余 ${Math.max(0, config.factRounds - progress.factRounds)} 轮</small></div>
          <div class="stat-card">STM 进度<strong>${progress.stmRounds} / ${config.stmRounds}</strong><small>剩余 ${Math.max(0, config.stmRounds - progress.stmRounds)} 轮</small></div>
          <div class="stat-card">记忆数量<strong>${memoryData.ltm.length} LTM | ${memoryData.stm.length} STM</strong></div>
          <div class="stat-card">下次清空 STM<strong>${progress.clearStmBeforeNext ? "是" : "否"}</strong></div>
          <div class="stat-card">自动生成<strong>事实 ${config.factsAuto ? "开" : "关"} · 引擎 ${config.engineAuto ? "开" : "关"}</strong></div>
        </div>
        ${memoryTable("stm", "短期记忆区", memoryData.stm)}
        ${memoryTable("ltm", "长期记忆区", memoryData.ltm)}
      `;
    }

    function memoryTable(kind, title, rows) {
      return `
        <div class="memory-section-header"><h3>${title}</h3><button class="secondary add-overview" data-kind="${kind}">+ 添加</button></div>
        <div class="memory-table-wrap"><table class="memory-table">
          <thead><tr><th>No.</th><th>时间</th><th>场景</th><th>事件（字符数）</th><th>操作</th></tr></thead>
          <tbody>${rows.length ? rows.map(item => `
            <tr><td>${item.sequence_no}</td><td>${escapeHtml(item.time_label)}</td><td>${escapeHtml(item.scene)}</td>
            <td>${escapeHtml(item.content)}（${[...item.content].length}）</td>
            <td class="memory-table-actions"><button class="icon-button edit-overview" data-kind="${kind}" data-id="${item.id}">编辑</button><button class="icon-button danger delete-overview" data-id="${item.id}">删除</button></td></tr>
          `).join("") : '<tr><td colspan="5" class="empty">暂无内容</td></tr>'}</tbody>
        </table></div>
      `;
    }

    function renderHistory() {
      const character = activeCharacter();
      if (!character) return;
      const rows = history
        .filter(item => item.character_id === character.id)
        .map(item => ({ ...item, date: historyDateParts(item.created_at) }));

      if (!rows.length) {
        selectedHistoryDate = null;
        selectedHistoryCharacterId = character.id;
        elements.historyList.className = "empty";
        elements.historyList.innerHTML = "该人设还没有自动记录的对话。";
        return;
      }

      const grouped = rows.reduce((result, item) => {
        const key = item.date.key;
        if (!result.has(key)) result.set(key, []);
        result.get(key).push(item);
        return result;
      }, new Map());
      const dates = [...grouped.keys()].sort((left, right) => right.localeCompare(left));

      if (selectedHistoryCharacterId !== character.id || !grouped.has(selectedHistoryDate)) {
        selectedHistoryDate = dates[0];
      }
      selectedHistoryCharacterId = character.id;

      elements.historyList.className = "history-layout";
      elements.historyList.innerHTML = `
        <div class="history-dates" aria-label="聊天记录日期">
          ${dates.map(key => {
            const items = grouped.get(key);
            const date = items[0].date;
            return `
              <button class="history-date ${key === selectedHistoryDate ? "active" : ""}"
                      data-history-date="${escapeHtml(key)}">
                <span class="history-date-main">${escapeHtml(date.label)}</span>
                <span class="history-date-detail">${escapeHtml(date.weekday)} · ${items.length} 条消息</span>
              </button>
            `;
          }).join("")}
        </div>
        <div class="history-messages">
          ${historyMessages(grouped.get(selectedHistoryDate))}
        </div>
      `;
      elements.historyList.querySelectorAll(".history-date").forEach(button => {
        button.addEventListener("click", () => {
          selectedHistoryDate = button.dataset.historyDate;
          renderHistory();
        });
      });
    }

    function historyDateParts(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return { key: "0000-00-00", label: "日期未知", weekday: "时间格式异常", time: "--:--" };
      }
      const parts = Object.fromEntries(
        new Intl.DateTimeFormat("zh-CN", {
          timeZone: "Asia/Shanghai",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          weekday: "short",
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23"
        }).formatToParts(date).map(part => [part.type, part.value])
      );
      return {
        key: `${parts.year}-${parts.month}-${parts.day}`,
        label: `${parts.month}月${parts.day}日`,
        weekday: parts.weekday,
        time: `${parts.hour}:${parts.minute}`
      };
    }

    function historyMessages(rows) {
      return [...rows]
        .sort((left, right) => {
          const leftTime = Date.parse(left.created_at);
          const rightTime = Date.parse(right.created_at);
          if (Number.isNaN(leftTime) || Number.isNaN(rightTime)) {
            return Number(left.id || 0) - Number(right.id || 0);
          }
          return leftTime - rightTime;
        })
        .map(item => {
          const isUser = item.role === "user";
          return `
            <div class="history-row ${isUser ? "user" : "assistant"}">
              <div class="history-message">
                <div class="history-meta">${isUser ? "用户" : "ClawBot"} · ${escapeHtml(item.date.time)}</div>
                <div class="history-bubble">${escapeHtml(item.content)}</div>
              </div>
            </div>
          `;
        }).join("");
    }

    async function addCharacter() {
      const name = prompt("请输入新人物名称：", "新 ClawBot");
      if (!name?.trim()) return;
      const id = `char_${Date.now()}`;
      state.characters.push({
        id,
        name: name.trim(),
        persona: { description: "", traits: "", examples: "" },
        memories: [],
        promptMemories: []
      });
      state.activeCharacterId = id;
      await saveBackend("人物已创建并同步。");
    }

    async function renameCharacter(id) {
      const character = state.characters.find(item => item.id === id);
      const name = prompt("请输入新名称：", character.name);
      if (!name?.trim()) return;
      character.name = name.trim();
      await saveBackend("人物名称已同步。");
    }

    async function deleteCharacter(id) {
      if (state.characters.length <= 1) return alert("至少保留一个人物。");
      if (!confirm("删除该人物及其人设和记忆？聊天历史仍保存在数据库中。")) return;
      state.characters = state.characters.filter(item => item.id !== id);
      if (state.activeCharacterId === id) state.activeCharacterId = state.characters[0].id;
      await saveBackend("人物已删除。");
    }

    async function savePersona() {
      const character = activeCharacter();
      character.persona = {
        description: elements.description.value.trim(),
        traits: elements.traits.value.trim(),
        examples: elements.examples.value.trim()
      };
      await saveBackend("人设已保存，ClawBot 下一条回复立即生效。");
    }

    async function addMemory(type, label) {
      const value = prompt(label);
      if (!value?.trim()) return;
      if (type === "rules") {
        activeCharacter().promptMemories.push(value.trim());
        await saveBackend("规则已同步到 ClawBot。");
        return;
      }
      await api(`/api/memory/${encodeURIComponent(activeCharacter().id)}/entries`, {
        method: "POST",
        body: JSON.stringify({ kind: "fact", content: value.trim(), source: "user", version: memoryData.version })
      });
      await loadMemory();
      renderMemories();
      setStatus("关键信息已添加。", "ok");
    }

    async function editMemory(type, index) {
      const item = type === "rules" ? activeCharacter().promptMemories[index] : memoryData.facts[index];
      const value = prompt("编辑内容：", type === "rules" ? item : item.content);
      if (value === null || !value.trim()) return;
      if (type === "rules") {
        activeCharacter().promptMemories[index] = value.trim();
        await saveBackend("规则已更新。");
        return;
      }
      await api(`/api/memory/${encodeURIComponent(activeCharacter().id)}/entries/${item.id}`, {
        method: "PUT",
        body: JSON.stringify({ content: value.trim(), timeLabel: "", scene: "", version: memoryData.version })
      });
      await loadMemory();
      renderMemories();
      setStatus("关键信息已更新，并标记为用户维护。", "ok");
    }

    async function deleteMemory(type, index) {
      if (!confirm("删除这条内容？")) return;
      if (type === "rules") {
        activeCharacter().promptMemories.splice(index, 1);
        await saveBackend("规则已删除。");
        return;
      }
      await deleteMemoryEntry(memoryData.facts[index].id);
      setStatus("关键信息已删除。", "ok");
    }

    async function saveMemorySettings() {
      const ids = ["factRounds", "stmRounds", "stmMinChars", "stmMaxChars", "ltmAfterStm", "ltmMinChars", "ltmMaxChars"];
      const config = { ...memoryData.config };
      ids.forEach(id => config[id] = Number(document.getElementById(id).value));
      config.summaryModel = document.getElementById("summaryModel").value;
      config.factsAuto = document.getElementById("factsAuto").checked;
      config.engineAuto = document.getElementById("engineAuto").checked;
      memoryData = await api(`/api/memory/${encodeURIComponent(activeCharacter().id)}/config`, {
        method: "PUT",
        body: JSON.stringify({ config, version: memoryData.version })
      });
      renderMemories();
      setStatus("记忆设置已保存。", "ok");
    }

    async function addOverviewEntry(kind) {
      const timeLabel = prompt("输入时间或时间范围：", new Date().toLocaleString("zh-CN"));
      if (timeLabel === null) return;
      const scene = prompt("输入场景：", "");
      if (scene === null) return;
      const content = prompt("输入记忆正文：", "");
      if (!content?.trim()) return;
      await api(`/api/memory/${encodeURIComponent(activeCharacter().id)}/entries`, {
        method: "POST",
        body: JSON.stringify({ kind, timeLabel, scene, content: content.trim(), source: "user", version: memoryData.version })
      });
      await loadMemory();
      renderMemories();
      setStatus("记忆条目已添加。", "ok");
    }

    async function editOverviewEntry(kind, id) {
      const list = kind === "stm" ? memoryData.stm : memoryData.ltm;
      const item = list.find(entry => entry.id === id);
      if (!item) return;
      const timeLabel = prompt("编辑时间或时间范围：", item.time_label);
      if (timeLabel === null) return;
      const scene = prompt("编辑场景：", item.scene);
      if (scene === null) return;
      const content = prompt("编辑记忆正文：", item.content);
      if (!content?.trim()) return;
      await api(`/api/memory/${encodeURIComponent(activeCharacter().id)}/entries/${id}`, {
        method: "PUT",
        body: JSON.stringify({ timeLabel, scene, content: content.trim(), version: memoryData.version })
      });
      await loadMemory();
      renderMemories();
      setStatus("记忆条目已更新，并标记为用户维护。", "ok");
    }

    async function deleteOverviewEntry(id) {
      if (!confirm("删除这条记忆？")) return;
      await deleteMemoryEntry(id);
      setStatus("记忆条目已删除。", "ok");
    }

    async function deleteMemoryEntry(id) {
      await api(`/api/memory/${encodeURIComponent(activeCharacter().id)}/entries/${id}`, {
        method: "DELETE",
        body: JSON.stringify({ version: memoryData.version })
      });
      await loadMemory();
      renderMemories();
    }

    function exportPrompt() {
      const character = activeCharacter();
      if (!character) return;
      const persona = character.persona;
      const sections = [`你是 ${character.name}。`];
      if (persona.description) sections.push(`【核心人设】\n${persona.description}`);
      if (persona.traits) sections.push(`【性格特点】\n${persona.traits}`);
      if (persona.examples) sections.push(`【示例对话】\n${persona.examples}`);
      if (character.promptMemories.length) sections.push(`【必须遵守的规则】\n${character.promptMemories.map(item => `- ${item}`).join("\n")}`);
      if (memoryData?.facts.length) sections.push(`【需要记住的关键事实】\n${memoryData.facts.map(item => `- ${item.content}`).join("\n")}`);
      if (memoryData?.stm.length) sections.push(`【短期记忆】\n${memoryData.stm.map(item => `${item.sequence_no}. ${item.time_label} | ${item.scene} | ${item.content}`).join("\n")}`);
      if (memoryData?.ltm.length) sections.push(`【长期记忆】\n${memoryData.ltm.map(item => `${item.sequence_no}. ${item.time_label} | ${item.scene} | ${item.content}`).join("\n")}`);
      navigator.clipboard.writeText(sections.join("\n\n"))
        .then(() => setStatus("完整提示词已复制。", "ok"))
        .catch(() => setStatus("复制失败，请检查浏览器剪贴板权限。", "error"));
    }

    document.querySelectorAll(".tab").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".tab, .panel").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        document.getElementById(button.dataset.tab).classList.add("active");
      });
    });
    elements.connect.addEventListener("click", loadBackend);
    elements.addCharacter.addEventListener("click", addCharacter);
    elements.savePersona.addEventListener("click", savePersona);
    elements.exportPrompt.addEventListener("click", exportPrompt);
    elements.memoryNav.addEventListener("click", event => {
      const button = event.target.closest("[data-memory-section]");
      if (!button) return;
      selectedMemorySection = button.dataset.memorySection;
      renderMemories();
    });

    elements.apiUrl.value = localStorage.getItem("clawbot_api_url") || "";
    elements.apiToken.value = sessionStorage.getItem("clawbot_api_token") || "";
    if (elements.apiUrl.value && elements.apiToken.value) loadBackend();
  </script>
</body>
</html>
