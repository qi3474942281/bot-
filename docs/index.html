<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClawBot 设置</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { max-width: 760px; margin: 40px auto; padding: 0 20px; background: #0b1220; color: #e5e7eb; }
    .card { background: #111b2e; border: 1px solid #26344d; border-radius: 16px; padding: 24px; }
    label { display: block; margin: 16px 0 6px; color: #a9b7cc; }
    input, textarea { box-sizing: border-box; width: 100%; padding: 11px; color: #fff; background: #09111f; border: 1px solid #34445f; border-radius: 8px; }
    textarea { min-height: 210px; font-family: ui-monospace, monospace; }
    button, a.button { display: inline-block; margin: 18px 8px 0 0; padding: 11px 16px; border: 0; border-radius: 8px; color: #fff; background: #2563eb; text-decoration: none; cursor: pointer; }
    .secondary { background: #334155 !important; }
    .note { color: #94a3b8; line-height: 1.6; }
    .ok { color: #86efac; }
    .error { color: #fca5a5; }
  </style>
</head>
<body>
  <h1>ClawBot 设置</h1>
  <p class="note">这里只管理公开的模型设置。API Key、接口地址和微信登录信息不会上传到 GitHub。</p>
  <div class="card">
    <label for="defaultModel">默认模型键</label>
    <input id="defaultModel">
    <label for="currentModel">当前模型键</label>
    <input id="currentModel">
    <label for="models">模型配置 JSON</label>
    <textarea id="models"></textarea>
    <button id="copy">复制完整 settings.json</button>
    <a class="button secondary" href="https://github.com/qi3474942281/bot-/edit/main/settings.json" target="_blank" rel="noreferrer">打开 GitHub 保存</a>
    <p id="status" class="note"></p>
  </div>
  <script>
    const status = document.querySelector("#status");
    const defaultModel = document.querySelector("#defaultModel");
    const currentModel = document.querySelector("#currentModel");
    const models = document.querySelector("#models");

    function buildSettings() {
      const parsedModels = JSON.parse(models.value);
      const result = {
        default_model: defaultModel.value.trim(),
        current_model: currentModel.value.trim(),
        models: parsedModels
      };
      if (!result.models[result.default_model] || !result.models[result.current_model]) {
        throw new Error("默认模型键和当前模型键必须存在于模型配置中。");
      }
      return result;
    }

    fetch("https://raw.githubusercontent.com/qi3474942281/bot-/main/settings.json", {
      cache: "no-store"
    })
      .then(response => {
        if (!response.ok) throw new Error(`读取设置失败：${response.status}`);
        return response.json();
      })
      .then(data => {
        defaultModel.value = data.default_model || "";
        currentModel.value = data.current_model || "";
        models.value = JSON.stringify(data.models || {}, null, 2);
        status.textContent = "已载入仓库当前设置。";
        status.className = "ok";
      })
      .catch(error => {
        status.textContent = error.message;
        status.className = "error";
      });

    document.querySelector("#copy").addEventListener("click", async () => {
      try {
        const text = JSON.stringify(buildSettings(), null, 2) + "\n";
        await navigator.clipboard.writeText(text);
        status.textContent = "已复制。请打开 GitHub 保存，用复制内容替换 settings.json 后提交。";
        status.className = "ok";
      } catch (error) {
        status.textContent = error.message;
        status.className = "error";
      }
    });
  </script>
</body>
</html>
